<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#142447"/></marker>
    <style>
      .title{font:700 42px Arial;fill:#10234b}.sub{font:600 22px Arial;fill:#31466d}.head{font:700 22px Arial;fill:#10234b}.txt{font:18px Arial;fill:#17243d}.small{font:15px Arial;fill:#17243d}.box{fill:#f5fbff;stroke:#1679a7;stroke-width:2}.store{fill:#edf9f1;stroke:#16823b;stroke-width:2}.panel{fill:#fff;stroke:#b9c9dc;stroke-width:2}.flow{fill:none;stroke:#142447;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#55708f;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="800" y="58" text-anchor="middle" class="title">Sentinel — Saving Evidence</text>
  <text x="800" y="92" text-anchor="middle" class="sub">Current flow • Manual API-triggered import</text>

  <rect x="35" y="125" width="360" height="610" rx="18" class="panel"/><text x="60" y="165" class="head">1  TELEMETRY PRODUCTION</text>
  <rect x="70" y="220" width="150" height="75" rx="12" class="box"/><text x="145" y="252" text-anchor="middle" class="txt">Incident Lab</text><text x="145" y="277" text-anchor="middle" class="txt">Application</text>
  <rect x="245" y="220" width="120" height="75" rx="12" class="box"/><text x="305" y="252" text-anchor="middle" class="small">OpenTelemetry</text><text x="305" y="275" text-anchor="middle" class="small">Collector</text>
  <path d="M220 257 H245" class="flow"/><text x="232" y="244" text-anchor="middle" class="small">OTLP</text>
  <rect x="95" y="390" width="90" height="58" rx="12" class="box"/><text x="140" y="425" text-anchor="middle" class="txt">Loki</text>
  <rect x="200" y="390" width="90" height="58" rx="12" class="box"/><text x="245" y="425" text-anchor="middle" class="txt">Tempo</text>
  <rect x="305" y="390" width="75" height="58" rx="12" class="box"/><text x="342" y="425" text-anchor="middle" class="small">Prometheus</text>
  <path d="M305 295 V345 H140 V390" class="flow"/><text x="155" y="338" class="small">Logs</text>
  <path d="M305 295 V360 H245 V390" class="flow"/><text x="250" y="352" class="small">Traces</text>
  <path d="M305 295 V375 H342 V390" class="flow"/><text x="318" y="368" text-anchor="end" class="small">Metrics</text>

  <rect x="430" y="125" width="300" height="610" rx="18" class="panel"/><text x="455" y="165" class="head">2  MANUAL TRIGGER</text>
  <rect x="465" y="220" width="230" height="300" rx="14" class="box"/><text x="580" y="255" text-anchor="middle" class="head">Operator / Client</text>
  <text x="485" y="310" class="small">POST /api/incidents/{id}/</text><text x="485" y="333" class="small">evidence/loki</text>
  <text x="485" y="385" class="small">POST /api/incidents/{id}/</text><text x="485" y="408" class="small">evidence/tempo</text>
  <text x="485" y="460" class="small">POST /api/incidents/{id}/</text><text x="485" y="483" class="small">evidence/prometheus</text>

  <rect x="770" y="125" width="500" height="610" rx="18" class="panel"/><text x="795" y="165" class="head">3  SENTINEL API</text>
  <rect x="830" y="210" width="380" height="60" rx="12" class="box"/><text x="1020" y="247" text-anchor="middle" class="txt">Select Incident + Time Window</text>
  <rect x="830" y="315" width="380" height="60" rx="12" class="box"/><text x="1020" y="352" text-anchor="middle" class="txt">Read-only Telemetry Connector</text>
  <rect x="830" y="420" width="380" height="60" rx="12" class="box"/><text x="1020" y="457" text-anchor="middle" class="txt">Normalize Evidence</text>
  <rect x="830" y="525" width="380" height="60" rx="12" class="box"/><text x="1020" y="562" text-anchor="middle" class="txt">Deduplicate Evidence</text>
  <rect x="830" y="630" width="380" height="60" rx="12" class="box"/><text x="1020" y="667" text-anchor="middle" class="txt">Persist Evidence</text>
  <path d="M695 240 H830" class="flow"/><text x="762" y="224" text-anchor="middle" class="small">Manual import request</text>
  <path d="M1020 270 V315" class="flow"/><path d="M1020 375 V420" class="flow"/><path d="M1020 480 V525" class="flow"/><path d="M1020 585 V630" class="flow"/>
  <path d="M140 448 V555 H790 V330 H830" class="dash"/><text x="455" y="548" text-anchor="middle" class="small">Loki: query logs → return Log Evidence</text>
  <path d="M245 448 V585 H805 V345 H830" class="dash"/><text x="510" y="578" text-anchor="middle" class="small">Tempo: query traces → return Trace Evidence</text>
  <path d="M342 448 V615 H820 V360 H830" class="dash"/><text x="565" y="608" text-anchor="middle" class="small">Prometheus: query metrics → return Metric Evidence</text>

  <rect x="1310" y="125" width="255" height="610" rx="18" class="panel"/><text x="1335" y="165" class="head">4  DATABASE</text>
  <rect x="1340" y="240" width="195" height="350" rx="30" class="store"/><text x="1437" y="292" text-anchor="middle" class="head">PostgreSQL</text>
  <rect x="1365" y="330" width="145" height="60" rx="10" class="panel"/><text x="1437" y="367" text-anchor="middle" class="txt">Incidents</text>
  <rect x="1365" y="420" width="145" height="115" rx="10" class="panel"/><text x="1437" y="453" text-anchor="middle" class="txt">Evidence</text><text x="1437" y="480" text-anchor="middle" class="small">Log • Trace • Metric</text><text x="1437" y="510" text-anchor="middle" class="small">IncidentId → Id</text>
  <path d="M1210 660 H1340" class="flow"/><text x="1275" y="640" text-anchor="middle" class="small">INSERT normalized,</text><text x="1275" y="658" text-anchor="middle" class="small">deduplicated Evidence</text>

  <rect x="80" y="775" width="650" height="90" rx="14" fill="#edf9f1" stroke="#16823b" stroke-width="2"/><text x="105" y="807" class="head">WHAT THIS FLOW DOES</text><text x="105" y="838" class="small">Collects evidence for one incident and time window • Normalizes it • Prevents duplicates • Stores it durably</text>
  <rect x="770" y="775" width="750" height="90" rx="14" fill="#f3f4f6" stroke="#718096" stroke-width="2"/><text x="795" y="807" class="head">OUTSIDE THIS DIAGRAM</text><text x="795" y="838" class="small">No RCA • No Ollama/OpenAI • No hypotheses • No vectors • No scheduler/background worker</text>
</svg>
