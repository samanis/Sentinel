  <path d="M1140 255H1190" fill="none" stroke="#233b59" stroke-width="3" marker-end="url(#a)"/><text x="1145" y="242" class="flow">3 webhook</text>
  <path d="M1425 275H1540" fill="none" stroke="#6a51d9" stroke-width="3" marker-end="url(#ap)"/><text x="1440" y="260" class="flow">4 durable save</text>
  <path d="M1540 350H1465V430H1425" fill="none" stroke="#6a51d9" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ap)"/><text x="1438" y="414" class="flow">5 claim pending run</text>
  <path d="M920 458H850V385H810" fill="none" stroke="#ca7e00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ao)"/><text x="825" y="371" class="flow">6a query Tempo traces</text>
  <path d="M920 488H850V465H625V403H610" fill="none" stroke="#ca7e00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ao)"/><text x="650" y="453" class="flow">6b query Loki logs</text>
  <path d="M1425 488H1540" fill="none" stroke="#ca7e00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ao)"/><text x="1440" y="473" class="flow">7 embed</text>
  <path d="M1425 535H1480V330H1540" fill="none" stroke="#6a51d9" stroke-width="3" marker-end="url(#ap)"/><text x="1440" y="522" class="flow">8 store bundle</text>
  <path d="M335 455H360V905H430" fill="none" stroke="#233b59" stroke-width="3" marker-end="url(#a)"/><text x="370" y="890" class="flow">9 question</text>
  <path d="M710 907H790" fill="none" stroke="#ca7e00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ao)"/><text x="724" y="892" class="flow">10 search</text>
  <path d="M900 835V745H1745V515" fill="none" stroke="#ca7e00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ao)"/><text x="1040" y="732" class="flow">11a question embedding</text>
  <path d="M1000 835V720H1500V330H1540" fill="none" stroke="#ca7e00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ao)"/><text x="1190" y="707" class="flow">11b vector similarity query in PostgreSQL</text>
  <path d="M1070 907H1150" fill="none" stroke="#233b59" stroke-width="3" marker-end="url(#a)"/><text x="1082" y="892" class="flow">12 context</text>
  <path d="M1420 930H1485V615H1540" fill="none" stroke="#233b59" stroke-width="3" marker-end="url(#a)"/><text x="1430" y="915" class="flow">13 generate</text>
  <path d="M1150 970H1090V1000H570V980" fill="none" stroke="#268c50" stroke-width="3" marker-end="url(#ag)"/><text x="745" y="1018" class="flow">14 answer + cited logs + traces + recurrence</text>

  <!-- legend -->
  <rect x="65" y="1010" width="270" height="150" rx="12" fill="#fff" stroke="#8595aa"/>
  <text x="85" y="1037" class="group">FLOW TYPES</text>
  <line x1="85" y1="1062" x2="135" y2="1062" stroke="#233b59" stroke-width="3" marker-end="url(#a)"/><text x="150" y="1067" class="tiny">synchronous call</text>
  <line x1="85" y1="1092" x2="135" y2="1092" stroke="#6a51d9" stroke-width="3" marker-end="url(#ap)"/><text x="150" y="1097" class="tiny">persist / process</text>
  <line x1="85" y1="1122" x2="135" y2="1122" stroke="#ca7e00" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ao)"/><text x="150" y="1127" class="tiny">read / query</text>
