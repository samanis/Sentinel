  <rect width="2048" height="1280" fill="#fbfcfe"/>
  <text x="1024" y="48" text-anchor="middle" class="title">SENTINEL - Current Logical Architecture</text>
  <text x="1024" y="80" text-anchor="middle" class="subtitle" style="font-weight:650;fill:#153a9a">Implemented MVP: alert ingestion, telemetry correlation, semantic retrieval, and incident RAG</text>
  <rect x="1680" y="20" width="305" height="42" rx="9" fill="#f0faf4" stroke="#299153" stroke-width="2"/>
  <text x="1832" y="47" text-anchor="middle" class="group" style="font-size:14px;fill:#18713c">IMPLEMENTED MVP - LIVE TODAY</text>

  <!-- client boundary -->
  <rect x="30" y="110" width="1988" height="1090" rx="20" fill="none" stroke="#2a9453" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="55" y="98" width="345" height="28" fill="#fbfcfe"/><text x="68" y="120" class="group" fill="#18713c">CLIENT-MANAGED ENVIRONMENT</text>

  <!-- external actors and sources -->
  <rect x="65" y="155" width="270" height="170" rx="12" class="box shadow" fill="#f0faf4" stroke="#299153"/>
  <text x="200" y="185" text-anchor="middle" class="group">TELEMETRY PRODUCER</text>
  <use href="#i-app" x="82" y="195" width="34" height="34" style="color:#238849"/>
  <text x="125" y="220" class="head">Client Application</text><text x="85" y="247" class="body">• OTLP metrics, logs, traces</text><text x="85" y="271" class="body">• Incident Lab sample app</text><text x="85" y="295" class="body">• Telemetry Generator (optional)</text>

  <rect x="65" y="385" width="270" height="150" rx="12" class="box shadow" fill="#f0faf4" stroke="#299153"/>
  <text x="200" y="417" text-anchor="middle" class="group">USERS</text>
  <use href="#i-user" x="82" y="426" width="34" height="34" style="color:#238849"/>
  <text x="125" y="452" class="head">Client Operator</text><text x="85" y="479" class="body">• SRE / DevOps</text><text x="85" y="503" class="body">• Platform / support</text>

  <!-- observability -->
  <rect x="390" y="140" width="450" height="410" rx="16" fill="#f4f8fd" stroke="#3477c9" stroke-width="2"/>
  <image href="Grafana-Icon.svg" x="394" y="149" width="25" height="26"/>
  <text x="620" y="171" text-anchor="middle" class="group" style="font-size:15px">LOCALLY HOSTED GRAFANA OBSERVABILITY STACK</text>
  <rect x="420" y="198" width="190" height="116" rx="10" class="box shadow" fill="#edf5ff" stroke="#3477c9"/>
  <text x="535" y="229" text-anchor="middle" class="head">OTel Collector</text><text x="440" y="259" class="body">• Receives OTLP</text><text x="440" y="283" class="body">• Routes signals by type</text>
  <use href="#i-route" x="431" y="207" width="29" height="29" style="color:#2871c9"/>
  <rect x="635" y="198" width="175" height="116" rx="10" class="box shadow" fill="#edf5ff" stroke="#3477c9"/>
  <text x="740" y="229" text-anchor="middle" class="head">Prometheus</text><text x="655" y="259" class="body">• Stores metrics</text><text x="655" y="283" class="body">• Evaluates rules</text>
  <use href="#i-metric" x="646" y="207" width="29" height="29" style="color:#2871c9"/>
  <rect x="420" y="345" width="190" height="116" rx="10" class="box shadow" fill="#edf5ff" stroke="#3477c9"/>
  <text x="515" y="376" text-anchor="middle" class="head">Loki</text><text x="440" y="406" class="body">• Persists logs</text><text x="440" y="430" class="body">• LogQL query API</text>
  <use href="#i-doc" x="431" y="354" width="28" height="28" style="color:#2871c9"/>
  <rect x="635" y="345" width="175" height="116" rx="10" class="box shadow" fill="#edf5ff" stroke="#3477c9"/>
  <text x="738" y="376" text-anchor="middle" class="head">Tempo</text><text x="655" y="406" class="body">• Persists traces</text><text x="655" y="430" class="body">• Trace query API</text>
  <use href="#i-trace" x="646" y="354" width="28" height="28" style="color:#2871c9"/>
  <rect x="470" y="485" width="290" height="48" rx="9" fill="#fff" stroke="#3477c9" stroke-width="2"/><text x="615" y="515" text-anchor="middle" class="head">Grafana dashboards / Explore</text>

  <!-- ingestion service -->
  <rect x="890" y="140" width="570" height="575" rx="16" fill="#f7f5ff" stroke="#6552d8" stroke-width="2"/>
  <text x="1175" y="172" text-anchor="middle" class="group">SENTINEL INGESTION</text>
  <rect x="920" y="198" width="220" height="116" rx="10" class="box shadow" fill="#f2efff" stroke="#6552d8"/>
  <text x="1045" y="229" text-anchor="middle" class="head">Alertmanager</text><text x="940" y="259" class="body">• Receives firing alert</text><text x="940" y="283" class="body">• Delivers webhook</text>
  <use href="#i-bell" x="934" y="207" width="30" height="30" style="color:#6048d8"/>
  <rect x="1190" y="198" width="235" height="155" rx="10" class="box shadow" fill="#f2efff" stroke="#6552d8"/>
  <text x="1308" y="229" text-anchor="middle" class="head">Sentinel API (C#)</text><text x="1210" y="259" class="body">• Validates Alertmanager JSON</text><text x="1210" y="283" class="body">• Persists every notification</text><text x="1210" y="307" class="body">• Creates/reuses occurrence</text><text x="1210" y="331" class="body">• Returns HTTP 202</text>
  <use href="#i-shield" x="1204" y="207" width="30" height="30" style="color:#6048d8"/>
  <rect x="920" y="402" width="505" height="170" rx="10" class="box shadow" fill="#f2efff" stroke="#6552d8"/>
  <text x="1195" y="434" text-anchor="middle" class="head">Ingestion Worker (C# deterministic pipeline)</text>
  <use href="#i-gear" x="942" y="415" width="32" height="32" style="color:#6048d8"/>
  <text x="945" y="466" class="body">• Polls and claims pending ingestion runs</text><text x="945" y="490" class="body">• Correlates Loki logs and Tempo traces by time, labels, and trace ID</text><text x="945" y="514" class="body">• Normalizes evidence and requests neural embedding</text><text x="945" y="538" class="body">• Stores canonical bundle and assigns similarity cluster</text>

  <!-- data and models -->
  <rect x="1510" y="140" width="470" height="575" rx="16" fill="#fff9ed" stroke="#ca7e00" stroke-width="2"/>
  <text x="1745" y="172" text-anchor="middle" class="group">DATA + MODEL SERVICES</text>
  <rect x="1540" y="198" width="410" height="155" rx="10" class="box shadow" fill="#fff7e5" stroke="#ca7e00"/>
  <text x="1745" y="229" text-anchor="middle" class="head">PostgreSQL + pgvector</text><text x="1565" y="259" class="body">• Notifications, occurrences, ingestion runs</text><text x="1565" y="283" class="body">• Canonical bundles, logs, traces</text><text x="1565" y="307" class="body">• 768-dimensional vectors + similarity clusters</text><text x="1565" y="331" class="body">• Counts distinct occurrences, not webhook retries</text>
  <use href="#i-db" x="1555" y="207" width="31" height="31" style="color:#bd7600"/>
  <rect x="1540" y="390" width="410" height="125" rx="10" class="box shadow" fill="#fff0f4" stroke="#d33f69"/>
  <text x="1745" y="421" text-anchor="middle" class="head">Ollama Embedding Service</text><text x="1565" y="451" class="body">• embeddinggemma</text><text x="1565" y="475" class="body">• Evidence and question embeddings</text><text x="1565" y="499" class="body">• Local neural semantic model</text>
  <use href="#i-brain" x="1555" y="399" width="31" height="31" style="color:#cc365e"/>
  <rect x="1540" y="553" width="410" height="125" rx="10" class="box shadow" fill="#fff0f4" stroke="#d33f69"/>
  <text x="1745" y="584" text-anchor="middle" class="head">Answer Model</text><text x="1565" y="614" class="body">• Ollama qwen3 or optional OpenAI</text><text x="1565" y="638" class="body">• Grounded answer from retrieved evidence</text><text x="1565" y="662" class="body">• Returns source IDs, logs, traces, recurrence</text>
  <use href="#i-spark" x="1555" y="562" width="31" height="31" style="color:#cc365e"/>

  <!-- rag -->
  <rect x="390" y="770" width="1070" height="255" rx="16" fill="#f7f5ff" stroke="#6552d8" stroke-width="2"/>
  <text x="925" y="802" text-anchor="middle" class="group">SENTINEL INCIDENT RAG</text>
  <rect x="430" y="835" width="280" height="145" rx="10" class="box shadow" fill="#f2efff" stroke="#6552d8"/>
  <text x="585" y="867" text-anchor="middle" class="head">POST /api/rag/query</text><text x="455" y="899" class="body">• Question + optional filters</text><text x="455" y="923" class="body">• Service / environment / limit</text><text x="455" y="947" class="body">• Read-only database connection</text>
  <use href="#i-shield" x="444" y="846" width="30" height="30" style="color:#6048d8"/>
  <rect x="790" y="835" width="280" height="145" rx="10" class="box shadow" fill="#fff7e5" stroke="#ca7e00"/>
  <text x="950" y="867" text-anchor="middle" class="head">Similarity Retrieval Logic</text><text x="815" y="899" class="body">• Requests question embedding</text><text x="815" y="923" class="body">• Queries PostgreSQL using pgvector</text><text x="815" y="947" class="body">• Returns logs, traces, and recurrence</text>
  <use href="#i-search" x="804" y="846" width="30" height="30" style="color:#bd7600"/>
  <rect x="1150" y="835" width="270" height="145" rx="10" class="box shadow" fill="#fff0f4" stroke="#d33f69"/>
  <text x="1300" y="867" text-anchor="middle" class="head">Grounded Generation</text><text x="1175" y="899" class="body">• Builds evidence context</text><text x="1175" y="923" class="body">• LLM creates final answer</text><text x="1175" y="947" class="body">• Preserves source evidence</text>
  <use href="#i-spark" x="1164" y="846" width="30" height="30" style="color:#cc365e"/>

  <!-- deployment -->
  <rect x="390" y="1060" width="1560" height="100" rx="14" fill="#f5f7fa" stroke="#8595aa" stroke-width="2"/>
  <text x="1170" y="1088" text-anchor="middle" class="group">LOCAL DOCKER DEPLOYMENT</text>
  <use href="#i-docker" x="955" y="1067" width="31" height="31" style="color:#52677f"/>
  <text x="430" y="1122" class="body">Sentinel API container</text><text x="680" y="1122" class="body">Sentinel Worker container</text><text x="955" y="1122" class="body">Sentinel RAG API container</text><text x="1230" y="1122" class="body">Grafana stack containers</text><text x="1505" y="1122" class="body">PostgreSQL / pgvector</text><text x="1750" y="1122" class="body">Ollama</text>

